# aind-ephys-pipeline-base
# Exact package lock of ghcr.io/allenneuraldynamics/aind-ephys-pipeline-base:1.5.0,
# recovered from the published image's layers (every distribution its own layers installed
# on top of the pinned base image). The Dockerfile next to this file installs the pip
# section below as-is (pip install --no-deps), after pip==26.2.2.
# Added to the published image: mtscomp (reader of compressed SpikeGLX .cbin data, used by SpikeInterface
# when an input needs it; it needs only numpy, pinned below, and tqdm, provided by the base image).

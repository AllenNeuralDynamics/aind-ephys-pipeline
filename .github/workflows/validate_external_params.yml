name: Validate params against external libraries

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [synchronize, opened, reopened]

jobs:
  validate-sorter-defaults:
    name: Validate sorter params against SpikeInterface defaults
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install $(grep -E '^spikeinterface==' environment/package-versions.txt | sed 's/^spikeinterface==/spikeinterface[full]==/')
          KS_VERSION=$(grep -oP 'kilosort4-base:\K[0-9.]+' environment/Dockerfile_kilosort4)
          echo "Installing kilosort==${KS_VERSION} (from environment/Dockerfile_kilosort4)"
          pip install "kilosort==${KS_VERSION}"

      - name: Check sorter params
        run: |
          python tests/check_sorter_params.py --params pipeline/default_params.json

  validate-postprocessing-params:
    name: Validate postprocessing params against SpikeInterface defaults
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install $(grep -E '^spikeinterface==' environment/package-versions.txt | sed 's/^spikeinterface==/spikeinterface[full]==/')

      - name: Check postprocessing params
        run: |
          python tests/check_postprocessing_params.py --params pipeline/default_params.json

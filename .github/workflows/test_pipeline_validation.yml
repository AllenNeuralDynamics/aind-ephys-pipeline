name: Test Pipeline Validation Error

on:
  pull_request:
      branches: [main]
      types: [synchronize, opened, reopened]

concurrency:  # Cancel previous workflows on the same pull request
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env: 
  NXF_SYNTAX_PARSER: v1

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        
        - name: Free up disk space
          run: |
            echo "Before cleanup:"
            df -h
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /opt/ghc
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/hostedtoolcache
            echo "After cleanup:"
            df -h
        
        - name: Set up Nextflow
          uses: nf-core/setup-nextflow@v1
          with:
            version: latest-stable

        - name: Run Nextflow pipeline
          run: |
            DATA_PATH="$(pwd)/tests/sample_dataset/nwb" RESULTS_PATH="$(pwd)/tests/sample_dataset/nwb/results" \
            nextflow  -C "$(pwd)/.github/workflows/nextflow_test.config" run pipeline/main_multi_backend.nf \
            --params_file "$(pwd)/.github/workflows/params_wrong.json" && exit 1 || exit 0
